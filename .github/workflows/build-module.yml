name: Build True Astronaut

on:
  push:
    branches: [ main, "work/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module structure and shell scripts
        run: sh tools/validate-module.sh
      - name: Package flashable development ZIP
        run: |
          mkdir -p dist
          zip -r dist/True-Astronaut-dev.zip \
            module.prop customize.sh service.sh action.sh \
            tools/collect-device-audit.sh
          unzip -l dist/True-Astronaut-dev.zip
      - uses: actions/upload-artifact@v4
        with:
          name: True-Astronaut-dev
          path: dist/True-Astronaut-dev.zip
